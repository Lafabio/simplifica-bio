<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material de Estudo - Simplifica BIO Online</title>
    <meta name="description" content="Materiais de biologia organizados por tema: slides das aulas e listas de exercícios para download. Simplifica BIO Online.">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316a34a'/><text x='50' y='72' font-size='58' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>B</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green-900: #0a3622;
            --green-800: #14532d;
            --green-700: #166534;
            --green-600: #16a34a;
            --green-500: #22c55e;
            --green-100: #dcfce7;
            --green-50: #f0fdf4;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--gray-800);
            background: var(--white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

        header {
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 0;
        }
        header .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--green-800);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: var(--green-600); }
        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--green-600), var(--green-800));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white;
        }
        nav { display: flex; align-items: center; gap: 28px; }
        nav a { color: var(--gray-600); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
        nav a:hover { color: var(--green-600); }
        nav a.active { color: var(--green-700); font-weight: 700; }

        .page-hero { background: linear-gradient(135deg, var(--green-50), var(--white)); padding: 56px 0 40px; }
        .page-hero h1 { font-size: 2.2rem; font-weight: 800; color: var(--gray-900); margin-bottom: 10px; }
        .page-hero h1 span { color: var(--green-600); }
        .page-hero p { color: var(--gray-600); margin-bottom: 24px; }
        .page-stats { display: flex; gap: 32px; }
        .page-stats strong { display: block; font-size: 1.4rem; font-weight: 800; color: var(--green-800); }
        .page-stats span { font-size: 0.85rem; color: var(--gray-600); }

        .controls { padding: 28px 0 8px; }
        .controls .container { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .search {
            flex: 1;
            min-width: 260px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: 8px;
            padding: 12px 16px;
            box-shadow: var(--shadow);
        }
        .search input {
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            width: 100%;
            background: transparent;
        }
        .search svg { color: var(--gray-600); flex-shrink: 0; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            border: 1px solid var(--gray-100);
            background: var(--white);
            border-radius: 999px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active { background: var(--green-600); color: white; border-color: var(--green-600); }

        .tema-list { padding: 24px 0 72px; }
        .tema-card {
            background: var(--white);
            border: 1px solid var(--gray-100);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .tema-card h3 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gray-100);
            padding-bottom: 16px;
        }
        .tema-num {
            width: 34px; height: 34px;
            border-radius: 8px;
            background: var(--green-600);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .grupo { margin-bottom: 16px; }
        .grupo-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray-600);
            margin-bottom: 10px;
        }
        .grupo-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
        .arquivo-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--gray-800);
            border: 1px solid var(--gray-100);
            transition: all 0.2s;
            font-size: 0.92rem;
        }
        .arquivo-link:hover { border-color: var(--green-500); background: var(--green-50); }
        .arquivo-link .f-icon { flex-shrink: 0; width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .arquivo-link.slide .f-icon { background: var(--green-100); color: var(--green-700); }
        .arquivo-link.lista .f-icon { background: #eef2ff; color: #4338ca; }
        .arquivo-link .f-name { flex: 1; }
        .arquivo-link .f-ext {
            flex-shrink: 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--gray-600);
            border: 1px solid var(--gray-100);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .arquivo-link .dl { flex-shrink: 0; color: var(--green-600); }

        .empty {
            text-align: center;
            padding: 60px 0;
            color: var(--gray-600);
        }

        footer {
            background: var(--gray-900);
            color: rgba(255,255,255,0.7);
            padding: 32px 0;
            text-align: center;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            nav { gap: 14px; }
            nav a { font-size: 0.85rem; }
            .page-hero h1 { font-size: 1.7rem; }
            .grupo-list { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <a href="index.html" class="logo" aria-label="Simplifica BIO - página inicial">
            <span class="logo-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c0-5 2-8 8-9-1 6-4 9-8 9z"/><path d="M4 20c3-1 5-3 8-9"/></svg>
            </span>
            Simplifica <span>BIO</span>
        </a>
        <nav>
            <a href="index.html">Início</a>
            <a href="materiais.html" class="active">Materiais</a>
            <a href="index.html#contato">Fale conosco</a>
        </nav>
    </div>
</header>

<section class="page-hero">
    <div class="container">
        <h1>Material de estudo <span>organizado por tema</span></h1>
        <p>Slides das aulas e listas de exercícios para você baixar e estudar onde quiser. Use a busca ou filtre por tipo.</p>
        <div class="page-stats" id="stats"></div>
    </div>
</section>

<section class="controls">
    <div class="container">
        <label class="search" for="busca">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="busca" placeholder="Buscar tema ou arquivo... (ex: genética, fisiologia, ecologia)">
        </label>
        <div class="filters" role="tablist" aria-label="Filtrar por tipo">
            <button class="filter-btn active" data-tipo="todos">Todos</button>
            <button class="filter-btn" data-tipo="slide">Slides</button>
            <button class="filter-btn" data-tipo="lista">Listas</button>
        </div>
    </div>
</section>

<section class="tema-list">
    <div class="container" id="lista-temas"></div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2026 Simplifica BIO Online. Todos os direitos reservados. | <a href="index.html" style="color:#22c55e;">Voltar ao início</a></p>
    </div>
</footer>

<script src="materiais.js"></script>
<script>
    function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function norm(s) {
        return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    function iconHTML(tipo) {
        return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
            + (tipo === 'slide'
                ? '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'
                : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/>')
            + '</svg>';
    }
    const totalSlides = MATERIAIS.reduce((n, t) => n + t.arquivos.filter(a => a.tipo === 'slide').length, 0);
    const totalListas = MATERIAIS.reduce((n, t) => n + t.arquivos.filter(a => a.tipo === 'lista').length, 0);
    document.getElementById('stats').innerHTML =
        '<div class="page-stats"><div class="page-stat"><strong>' + MATERIAIS.length + '</strong><span>temas</span></div>'
        + '<div class="page-stat"><strong>' + totalSlides + '</strong><span>slides</span></div>'
        + '<div class="page-stat"><strong>' + totalListas + '</strong><span>listas de exercícios</span></div></div>';

    const lista = document.getElementById('lista-temas');
    let filtroTipo = 'todos';
    let filtroTexto = '';

    function grupoHTML(titulo, arquivos, tipo) {
        if (arquivos.length === 0) return '';
        return '<div class="grupo"><div class="grupo-title">' + titulo + '</div><div class="grupo-list">'
            + arquivos.map(a =>
                '<a class="arquivo-link ' + tipo + '" href="' + esc(a.url) + '" download title="Baixar ' + esc(a.nome) + '">'
                + '<span class="f-icon">' + iconHTML(tipo) + '</span>'
                + '<span class="f-name">' + esc(a.nome) + '</span>'
                + '<span class="f-ext">' + (tipo === 'slide' ? 'PPTX' : 'DOCX') + '</span>'
                + '<span class="dl">' + iconHTML('slide') + '</span>'
                + '</a>').join('')
            + '</div></div>';
    }

    function render() {
        const q = filtroTexto ? norm(filtroTexto) : '';
        let visiveis = 0;
        let html = '';
        MATERIAIS.forEach(top => {
            const arquivos = top.arquivos.filter(a =>
                (filtroTipo === 'todos' || a.tipo === filtroTipo) &&
                (!q || norm(a.nome).includes(q) || norm(top.tema).includes(q))
            );
            if (arquivos.length === 0) return;
            visiveis++;
            const slides = arquivos.filter(a => a.tipo === 'slide');
            const listas = arquivos.filter(a => a.tipo === 'lista');
            html += '<article class="tema-card"><h3><span class="tema-num">' + top.numero + '</span>' + esc(top.tema) + '</h3>'
                + grupoHTML('Slides', slides, 'slide')
                + grupoHTML('Listas de exercícios', listas, 'lista')
                + '</article>';
        });
        lista.innerHTML = html || '<div class="empty">Nenhum material encontrado. Tente outro termo.</div>';
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtroTipo = btn.dataset.tipo;
            render();
        });
    });
    document.getElementById('busca').addEventListener('input', e => {
        filtroTexto = e.target.value;
        render();
    });

    render();
</script>
</body>
</html>
